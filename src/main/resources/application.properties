# Densidad rho = N / L^2 (el enunciado pide correr con 2, 4 y 8)
flocking.rho=4.0

# Lado de la caja cuadrada (fijo en 10 por enunciado, pero configurable para tests)
flocking.l=10.0

# Radio de interaccion rc
flocking.rc=1.0

# Rapidez constante de cada particula (paper original de Vicsek 1995: v0 = 0.03)
flocking.v0=0.03

# Paso temporal
flocking.dt=1.0

# Parametro de ruido eta (el enunciado pide barrer este valor)
flocking.eta=1.0

# Cantidad de pasos de la simulacion
flocking.steps=1000

# VICSEK (promedia direccion de vecinos) o VOTER (copia a un vecino al azar)
flocking.model=VICSEK

# Semilla para reproducibilidad; vacio = aleatoria real
flocking.random-seed=
